[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vrf"
version = "0.1.0"
description = "Backend VRF"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy>=2.0",
  "alembic",
  "pydantic-settings",
  "psycopg[binary]",
  "bcrypt",
  "PyJWT",
  "python-multipart",
  "pypdf",
  "pytesseract",
  "Pillow",
  "pypdfium2",
  "openpyxl",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]